<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calculadora Completa</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer;color:#fff}
.app{position:fixed;inset:0;width:100%;height:100dvh;max-width:430px;margin:auto;background:#000;overflow:hidden;padding:10px 18px max(12px,env(safe-area-inset-bottom))}
.top{height:58px;display:flex;justify-content:space-between;align-items:center}
.top button{width:54px;height:54px;border-radius:50%;background:#191919;border:1px solid #303030;font-size:24px}
.display{position:absolute;left:18px;right:18px;bottom:calc(12px + min(58vh,430px) + 16px);height:112px;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}
.displayStack{text-align:right;width:100%;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end}
.expression{font-size:23px;color:#777;line-height:28px;min-height:28px;white-space:nowrap;overflow:hidden;max-width:100%}
.result{font-size:70px;font-weight:300;line-height:78px;letter-spacing:-3px;white-space:nowrap;overflow:hidden;max-width:100%}
.grid{position:absolute;left:18px;right:18px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{width:100%;aspect-ratio:1;border-radius:50%;background:#292929;font-size:29px;display:flex;align-items:center;justify-content:center}
.key.gray{background:#5a5a5c}.key.orange{background:#ff9f0a}
@media(max-height:760px){.grid{gap:7px}.key{font-size:25px}.display{height:95px;bottom:calc(8px + min(58vh,350px) + 12px)}.result{font-size:58px}.expression{font-size:19px}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:70px 14px 14px}
.panel{width:min(400px,100%);max-height:calc(100dvh - 84px);overflow:auto;background:#1b1b1d;border:1px solid #333;border-radius:24px;padding:14px;box-shadow:0 20px 70px #000}
.panel h2{margin:5px 4px 14px;font-size:21px;text-align:center}
.close{position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:50%;background:#292929;font-size:24px}
.option{width:100%;padding:15px;margin:5px 0;border-radius:15px;background:#292929;text-align:left;font-size:17px}
.option:active,.key:active,.top button:active{filter:brightness(1.3)}
.card{background:#101010;border-radius:17px;padding:13px;margin:8px 0}
label{display:block;color:#aaa;font-size:13px;margin-bottom:6px}
input,select{width:100%;background:#252527;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;outline:none}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action{background:#ff9f0a;border-radius:13px;padding:13px;width:100%;margin-top:9px}
.answer{font-size:24px;margin-top:10px;word-break:break-word}
.sciDisplay{background:#090909;border-radius:16px;padding:12px;text-align:right;margin-bottom:10px;min-height:75px}
.sciExpr{color:#777;font-size:15px;min-height:20px}
.sciResult{font-size:38px;white-space:nowrap;overflow:hidden}
.sciGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sciKey{min-height:53px;border-radius:14px;background:#292929;font-size:18px}
.sciKey.gray{background:#5a5a5c}.sciKey.orange{background:#ff9f0a}
.historyItem{padding:12px 2px;border-bottom:1px solid #333}
.historyItem b{font-size:16px}.muted{color:#777;font-size:12px;margin-top:3px}
.empty{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button onclick="openModal('historyModal')">◷</button>
    <button onclick="openModal('functionsModal')">🧮</button>
  </div>

  <div class="display">
    <div class="displayStack">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>
  </div>

  <div class="grid">
    <button class="key gray" onclick="clearMain()">AC</button>
    <button class="key gray" onclick="backMain()">⌫</button>
    <button class="key gray" onclick="mainPercent()">%</button>
    <button class="key orange" onclick="mainOp('/')">÷</button>
    <button class="key" onclick="mainDigit('7')">7</button><button class="key" onclick="mainDigit('8')">8</button><button class="key" onclick="mainDigit('9')">9</button><button class="key orange" onclick="mainOp('*')">×</button>
    <button class="key" onclick="mainDigit('4')">4</button><button class="key" onclick="mainDigit('5')">5</button><button class="key" onclick="mainDigit('6')">6</button><button class="key orange" onclick="mainOp('-')">−</button>
    <button class="key" onclick="mainDigit('1')">1</button><button class="key" onclick="mainDigit('2')">2</button><button class="key" onclick="mainDigit('3')">3</button><button class="key orange" onclick="mainOp('+')">+</button>
    <button class="key" onclick="mainSign()">+/−</button><button class="key" onclick="mainDigit('0')">0</button><button class="key" onclick="mainDigit('.')">,</button><button class="key orange" onclick="mainEquals()">=</button>
  </div>
</div>

<div class="modal" id="functionsModal">
 <div class="panel">
  <button class="close" onclick="closeModals()">×</button>
  <h2>⚙️ FUNÇÕES</h2>
  <button class="option" onclick="openFeature('scientific')">📐 Científica</button>
  <button class="option" onclick="openFeature('finance')">💰 Financeira</button>
  <button class="option" onclick="openFeature('percent')">📊 Porcentagem</button>
  <button class="option" onclick="openFeature('geometry')">📏 Geometria</button>
  <button class="option" onclick="openFeature('equations')">🧮 Equações</button>
  <button class="option" onclick="openFeature('converter')">🔄 Conversores</button>
  <button class="option" onclick="openModal('historyModal')">📜 Histórico</button>
 </div>
</div>

<div class="modal" id="historyModal">
 <div class="panel">
  <button class="close" onclick="closeModals()">×</button>
  <h2>📜 HISTÓRICO</h2>
  <div id="historyList"></div>
  <button class="option" onclick="clearHistory()">🗑️ Limpar histórico</button>
 </div>
</div>

<div class="modal" id="featureModal">
 <div class="panel" id="featureContent"></div>
</div>

<script>
let main='0', stored=null, mainOperator=null, fresh=false;
let history=JSON.parse(localStorage.getItem('calcHistory')||'[]');

const $=id=>document.getElementById(id);
function fmt(n){return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:10})}
function symbol(o){return o==='+'?'+':o==='-'?'−':o==='*'?'×':'÷'}
function renderMain(){ $('result').textContent=fmt(main); }
function saveHistory(expr,res,type='Cálculo'){
 history.unshift({expr,result:fmt(res),type,time:new Date().toLocaleString('pt-BR')});
 history=history.slice(0,100);localStorage.setItem('calcHistory',JSON.stringify(history));
}
function mainDigit(x){
 if(fresh){main='0';fresh=false}
 if(x==='.'&&main.includes('.'))return;
 if(main==='0'&&x!=='.')main=x;else main+=x;
 renderMain();
}
function mainOp(o){
 stored=parseFloat(main);mainOperator=o;fresh=true;
 $('expression').textContent=fmt(stored)+' '+symbol(o);
}
function mainEquals(){
 if(mainOperator===null)return;
 let a=stored,b=parseFloat(main),r=mainOperator==='+'?a+b:mainOperator==='-'?a-b:mainOperator==='*'?a*b:a/b;
 $('expression').textContent=fmt(a)+' '+symbol(mainOperator)+' '+fmt(b);
 main=String(Number(r.toFixed(10)));mainOperator=null;fresh=true;saveHistory($('expression').textContent,r);renderMain();
}
function mainPercent(){main=String(parseFloat(main)/100);renderMain()}
function mainSign(){main=String(-parseFloat(main));renderMain()}
function backMain(){main=main.length>1?main.slice(0,-1):'0';renderMain()}
function clearMain(){main='0';stored=null;mainOperator=null;fresh=false;$('expression').textContent='';renderMain()}

function openModal(id){closeModals();$(id).style.display='flex';if(id==='historyModal')renderHistory()}
function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}
function renderHistory(){
 let box=$('historyList');
 box.innerHTML=history.length?history.map(x=>`<div class="historyItem"><b>${x.expr} = ${x.result}</b><div class="muted">${x.type} • ${x.time}</div></div>`).join(''):'<div class="empty">Nenhum cálculo ainda.</div>';
}
function clearHistory(){history=[];localStorage.removeItem('calcHistory');renderHistory()}

const features={
 scientific:`<button class="close" onclick="closeModals()">×</button><h2>📐 Científica</h2>
 <div class="sciDisplay"><div id="sciExpr" class="sciExpr"></div><div id="sciRes" class="sciResult">0</div></div>
 <div class="sciGrid">
 <button class="sciKey gray" onclick="sciClear()">AC</button><button class="sciKey gray" onclick="sciBack()">⌫</button><button class="sciKey gray" onclick="sciUnary('sqrt')">√</button><button class="sciKey orange" onclick="sciOp('pow')">xʸ</button>
 <button class="sciKey" onclick="sciDigit('7')">7</button><button class="sciKey" onclick="sciDigit('8')">8</button><button class="sciKey" onclick="sciDigit('9')">9</button><button class="sciKey orange" onclick="sciOp('/')">÷</button>
 <button class="sciKey" onclick="sciDigit('4')">4</button><button class="sciKey" onclick="sciDigit('5')">5</button><button class="sciKey" onclick="sciDigit('6')">6</button><button class="sciKey orange" onclick="sciOp('*')">×</button>
 <button class="sciKey" onclick="sciDigit('1')">1</button><button class="sciKey" onclick="sciDigit('2')">2</button><button class="sciKey" onclick="sciDigit('3')">3</button><button class="sciKey orange" onclick="sciOp('-')">−</button>
 <button class="sciKey" onclick="sciDigit('0')">0</button><button class="sciKey" onclick="sciDigit('.')">,</button><button class="sciKey" onclick="sciUnary('square')">x²</button><button class="sciKey orange" onclick="sciOp('+')">+</button>
 <button class="sciKey" onclick="sciUnary('sin')">sin</button><button class="sciKey" onclick="sciUnary('cos')">cos</button><button class="sciKey" onclick="sciUnary('tan')">tan</button><button class="sciKey orange" onclick="sciEq()">=</button>
 </div>`,
 finance:`<button class="close" onclick="closeModals()">×</button><h2>💰 Financeira</h2>
 <div class="card"><div class="formgrid"><div><label>Capital</label><input id="finCapital" type="number" value="1000"></div><div><label>Taxa %</label><input id="finRate" type="number" value="2"></div><div><label>Períodos</label><input id="finPeriods" type="number" value="12"></div><div><label>Aportes por período</label><input id="finDeposit" type="number" value="0"></div></div><button class="action" onclick="calcFinance()">Calcular juros compostos</button><div id="finAnswer" class="answer"></div></div>`,
 percent:`<button class="close" onclick="closeModals()">×</button><h2>📊 Porcentagem</h2>
 <div class="card"><label>Quanto é X% de Y?</label><div class="formgrid"><input id="pctX" type="number" value="20"><input id="pctY" type="number" value="500"></div><button class="action" onclick="calcPct()">Calcular</button><div id="pctAnswer" class="answer"></div></div>
 <div class="card"><label>Qual a porcentagem de A em B?</label><div class="formgrid"><input id="pctA" type="number" value="100"><input id="pctB" type="number" value="500"></div><button class="action" onclick="calcPct2()">Calcular</button><div id="pctAnswer2" class="answer"></div></div>`,
 geometry:`<button class="close" onclick="closeModals()">×</button><h2>📏 Geometria</h2>
 <div class="card"><label>Forma</label><select id="geoShape" onchange="geoFields()"><option value="circle">Círculo</option><option value="rectangle">Retângulo</option><option value="triangle">Triângulo</option></select><div id="geoInputs" class="formgrid" style="margin-top:9px"></div><button class="action" onclick="calcGeo()">Calcular</button><div id="geoAnswer" class="answer"></div></div>`,
 equations:`<button class="close" onclick="closeModals()">×</button><h2>🧮 Equações</h2>
 <div class="card"><label>Bhaskara — ax² + bx + c = 0</label><div class="formgrid"><input id="eqA" type="number" value="1" placeholder="a"><input id="eqB" type="number" value="-5" placeholder="b"><input id="eqC" type="number" value="6" placeholder="c"></div><button class="action" onclick="calcBhaskara()">Resolver</button><div id="eqAnswer" class="answer"></div></div>`,
 converter:`<button class="close" onclick="closeModals()">×</button><h2>🔄 Conversores</h2>
 <div class="card"><label>Conversão</label><select id="convType"><option value="kmmi">Quilômetros → Milhas</option><option value="mft">Metros → Pés</option><option value="kglb">Quilos → Libras</option><option value="cf">Celsius → Fahrenheit</option><option value="fc">Fahrenheit → Celsius</option></select><input id="convValue" type="number" value="100" style="margin-top:9px"><button class="action" onclick="calcConv()">Converter</button><div id="convAnswer" class="answer"></div></div>`
};

function openFeature(name){$('featureContent').innerHTML=features[name];openModal('featureModal');if(name==='geometry')geoFields()}

let sci='0',sciStore=null,sciOperator=null,sciFresh=false;
function sciRender(){if($('sciRes'))$('sciRes').textContent=fmt(sci)}
function sciDigit(x){if(sciFresh){sci='0';sciFresh=false}if(x==='.'&&sci.includes('.'))return;if(sci==='0'&&x!=='.')sci=x;else sci+=x;sciRender()}
function sciClear(){sci='0';sciStore=null;sciOperator=null;sciFresh=false;if($('sciExpr'))$('sciExpr').textContent='';sciRender()}
function sciBack(){sci=sci.length>1?sci.slice(0,-1):'0';sciRender()}
function sciOp(o){sciStore=parseFloat(sci);sciOperator=o;sciFresh=true;$('sciExpr').textContent=fmt(sciStore)+' '+symbol(o==='pow'?'^':o)}
function sciEq(){if(sciOperator===null)return;let a=sciStore,b=parseFloat(sci),r=sciOperator==='pow'?a**b:sciOperator==='+'?a+b:sciOperator==='-'?a-b:sciOperator==='*'?a*b:a/b;$('sciExpr').textContent=fmt(a)+' '+symbol(sciOperator==='pow'?'^':sciOperator)+' '+fmt(b);sci=String(Number(r.toFixed(10)));sciOperator=null;sciFresh=true;sciRender();saveHistory($('sciExpr').textContent,r,'Científica')}
function sciUnary(type){let a=parseFloat(sci),r=type==='sqrt'?Math.sqrt(a):type==='square'?a*a:type==='sin'?Math.sin(a*Math.PI/180):type==='cos'?Math.cos(a*Math.PI/180):Math.tan(a*Math.PI/180);$('sciExpr').textContent=(type==='sqrt'?'√':type==='square'?'x²':type)+'('+fmt(a)+')';sci=String(Number(r.toFixed(10)));sciFresh=true;sciRender();saveHistory($('sciExpr').textContent,r,'Científica')}

function calcFinance(){let c=+$('finCapital').value,r=+$('finRate').value/100,n=+$('finPeriods').value,p=+$('finDeposit').value;let total=c*(1+r)**n+p*((1+r)**n-1)/r; if(!r)total=c+p*n;$('finAnswer').innerHTML=`Montante: <b>R$ ${fmt(total)}</b>`;saveHistory('Juros compostos',total,'Financeira')}
function calcPct(){let x=+$('pctX').value,y=+$('pctY').value,r=y*x/100;$('pctAnswer').innerHTML=`Resultado: <b>${fmt(r)}</b>`;saveHistory(`${x}% de ${y}`,r,'Porcentagem')}
function calcPct2(){let a=+$('pctA').value,b=+$('pctB').value,r=a/b*100;$('pctAnswer2').innerHTML=`Resultado: <b>${fmt(r)}%</b>`;saveHistory(`${a} de ${b}`,r+'%','Porcentagem')}
function geoFields(){let t=$('geoShape').value;let h=t==='circle'?'<div><label>Raio</label><input id="g1" type="number" value="5"></div>':t==='rectangle'?'<div><label>Largura</label><input id="g1" type="number" value="10"></div><div><label>Altura</label><input id="g2" type="number" value="5"></div>':'<div><label>Base</label><input id="g1" type="number" value="10"></div><div><label>Altura</label><input id="g2" type="number" value="6"></div>';$('geoInputs').innerHTML=h}
function calcGeo(){let t=$('geoShape').value,a=+$('g1').value,b=+$('g2')?.value||0,area=t==='circle'?Math.PI*a*a:t==='rectangle'?a*b:a*b/2;let name=t==='circle'?'círculo':t==='rectangle'?'retângulo':'triângulo';$('geoAnswer').innerHTML=`Área do ${name}: <b>${fmt(area)}</b>`;saveHistory(`Área do ${name}`,area,'Geometria')}
function calcBhaskara(){let a=+$('eqA').value,b=+$('eqB').value,c=+$('eqC').value,d=b*b-4*a*c;if(a===0){$('eqAnswer').textContent='a não pode ser 0.';return}if(d<0){$('eqAnswer').textContent='Não existem raízes reais.';return}let x1=(-b+Math.sqrt(d))/(2*a),x2=(-b-Math.sqrt(d))/(2*a);$('eqAnswer').innerHTML=`x₁ = <b>${fmt(x1)}</b><br>x₂ = <b>${fmt(x2)}</b>`;saveHistory('Bhaskara',`x₁=${fmt(x1)}, x₂=${fmt(x2)}`,'Equações')}
function calcConv(){let v=+$('convValue').value,t=$('convType').value,r,u;if(t==='kmmi'){r=v*0.621371;u='mi'}else if(t==='mft'){r=v*3.28084;u='ft'}else if(t==='kg'){r=v*2.20462;u='lb'}else if(t==='kg'){r=v*2.20462;u='lb'}else if(t==='cf'){r=v*9/5+32;u='°F'}else{r=(v-32)*5/9;u='°C'}$('convAnswer').innerHTML=`Resultado: <b>${fmt(r)} ${u}</b>`;saveHistory(`${v} conversão`,r+' '+u,'Conversores')}
renderMain();renderHistory();
</script>
</body>
</html>
